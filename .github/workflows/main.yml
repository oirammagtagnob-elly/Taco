name: Render video

on:
  workflow_dispatch:
    inputs:
      video:
        description: "Which video to render"
        type: choice
        options: [tacoma, millennium]
        default: millennium
      quality:
        description: "draft = half size and fast, full = final quality"
        type: choice
        options: [draft, full]
        default: draft
      format:
        description: "Video shape"
        type: choice
        options: [vertical, wide]
        default: vertical
      captions:
        description: "Burn captions into the video (leave off if you will caption in CapCut)"
        type: boolean
        default: false
      voice:
        description: "Make a real voiceover with ElevenLabs (needs the ELEVENLABS_API_KEY secret)"
        type: boolean
        default: false

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unpack the newest project bundle
        run: |
          best=""; bt=-1
          for f in project-bundle*; do
            [ -f "$f" ] || continue
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            echo "found: $f (committed at $t)"
            if [ "$t" -gt "$bt" ]; then best="$f"; bt=$t; fi
          done
          [ -n "$best" ] || { echo "::error::No project-bundle file found in the repo."; exit 1; }
          echo "Using: $best"
          base64 -d "$best" > three-remotion.zip
          rm -rf three-remotion
          unzip -q -o three-remotion.zip
          if [ "${{ inputs.video }}" = "millennium" ] && ! grep -q 'id="Millennium"' three-remotion/src/Root.tsx; then
            echo "::error::The bundle '$best' is old: it has no Millennium video. Upload the newest project-bundle.txt to the repo, then run again."
            exit 1
          fi

      - name: Install system libraries for Chrome
        run: >
          sudo apt-get update && sudo apt-get install -y
          libnss3 libdbus-1-3 libatk1.0-0 libasound2 libxrandr2 libxkbcommon-dev
          libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libpango-1.0-0 libcairo2 libcups2

      - name: Install the project
        working-directory: three-remotion
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: bash setup.sh

      - name: Make the voiceover
        if: ${{ inputs.voice && inputs.video == 'tacoma' }}
        working-directory: three-remotion
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            node scripts/generate-voiceover.mjs
          else
            echo "No ELEVENLABS_API_KEY secret found. Using the silent placeholder."
          fi

      - name: Render
        working-directory: three-remotion
        run: |
          VERT=true
          if [ "${{ inputs.format }}" = "wide" ]; then VERT=false; fi
          echo "{\"vertical\": $VERT, \"showCaptions\": ${{ inputs.captions }}}" > props-run.json
          ARGS="--gl=swangle --props=props-run.json"
          if [ "${{ inputs.quality }}" = "draft" ]; then ARGS="$ARGS --scale=0.5"; fi
          COMP=MainVideo
          if [ "${{ inputs.video }}" = "millennium" ]; then COMP=Millennium; fi
          npx remotion render src/index.ts $COMP out/video.mp4 $ARGS

      - name: Save the video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video }}-video
          path: three-remotion/out/video.mp4
          retention-days: 7
